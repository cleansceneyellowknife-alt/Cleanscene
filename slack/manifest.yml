# Slack app manifest for "CleanScene Ops" (used by setup_slack.py and Zapier posts).
# Create at https://api.slack.com/apps > Create New App > From an app manifest.
display_information:
  name: CleanScene Ops
  description: Sets up CleanScene channels and posts leads, wins and schedule notes.
  background_color: "#1f3a5f"
features:
  bot_user:
    display_name: CleanScene Ops
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:manage
      - channels:read
      - channels:join
      - groups:write
      - groups:read
      - chat:write
      - pins:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
